worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;
events { worker_connections 4; }
http {
  access_log off;
  client_body_temp_path /tmp/cb;
  proxy_temp_path /tmp/pt;
  server {
    listen 8080;
    http2 on;
    location /slow {
      proxy_pass http://backend:9000/slow;
      proxy_connect_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering off;
    }
  }
}
