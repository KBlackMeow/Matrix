services:
  backend:
    image: python:3.12-slim
    command: ["python", "/app/backend.py"]
    volumes: ["./backend.py:/app/backend.py:ro"]
  nginx:
    build:
      context: .
      args:
        BASE: ${BASE:-nginx:1.31.8}
    cap_add: ["NET_ADMIN"]
    ports: ["${PORT:-18090}:8080"]
    depends_on: [backend]
